<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Menu Notes — CertLab</title>
  <link rel="stylesheet" href="menunotes.css">
</head>
<body>
  <div class="screen">
    <header class="mn-header">
      <button class="back" onclick="location.href='landingpage.html'">‹ Back</button>
      <div class="title">NOTES : HCL</div>
      <div class="menu-wrap">
        <button class="dots" aria-label="open menu" aria-expanded="false">⋯</button>
        <div class="menu-panel" aria-hidden="true" style="display:none" role="menu">
          <a class="menu-btn" href="profile.html" role="menuitem">👤 Profile</a>
          <a class="menu-btn" href="landingpage.html" role="menuitem">🏠 Home</a>
        </div>
      </div>
    </header>

    <main class="mn-main">
      <div class="chapters">
        <div class="chapter">
          <button class="chapter-btn" data-target="ch1">CHAPTER 1</button>
          <div id="ch1" class="chapter-body">
            <button class="item item-btn" type="button" data-href="video-note.html" aria-label="Chapter 1 video">
              <div class="item-text">TOPIC 1 INTRO TO HCL<br><span class="muted">VIDEO</span></div>
              <div class="item-icon video">▶</div>
            </button>
            <button class="item item-btn" type="button" data-href="note-exercise.html" aria-label="Chapter 1 file">
              <div class="item-text">TOPIC 1 INTRO TO HCL<br><span class="muted">FILE</span></div>
              <div class="item-icon file">📁</div>
            </button>
            <button class="item item-btn" type="button" data-href="test.html?ch=1" aria-label="Chapter 1 test" data-test-id="ch1">
              <div class="item-text">TEST</div>
              <div class="item-icon question" data-test-icon="ch1">?</div>
            </button>
          </div>
        </div>

        <div class="chapter">
          <button class="chapter-btn" data-target="ch2">CHAPTER 2</button>
          <div id="ch2" class="chapter-body">
            <button class="item item-btn" type="button" data-href="video-note.html" aria-label="Chapter 2 video">
              <div class="item-text">TOPIC 2 INTRO TO HCL<br><span class="muted">VIDEO</span></div>
              <div class="item-icon video">▶</div>
            </button>
            <button class="item item-btn" type="button" data-href="note-exercise.html" aria-label="Chapter 2 file">
              <div class="item-text">TOPIC 2 INTRO TO HCL<br><span class="muted">FILE</span></div>
              <div class="item-icon file">📁</div>
            </button>
            <button class="item item-btn" type="button" data-href="test.html?ch=2" aria-label="Chapter 2 test" data-test-id="ch2">
              <div class="item-text">TEST</div>
              <div class="item-icon question" data-test-icon="ch2">?</div>
            </button>
          </div>
        </div>

        <div class="chapter">
          <button class="chapter-btn" data-target="ch3">CHAPTER 3</button>
          <div id="ch3" class="chapter-body">
            <button class="item item-btn" type="button" data-href="video-note.html" aria-label="Chapter 3 video">
              <div class="item-text">TOPIC 3 INTRO TO HCL<br><span class="muted">VIDEO</span></div>
              <div class="item-icon video">▶</div>
            </button>
            <button class="item item-btn" type="button" data-href="note-exercise.html" aria-label="Chapter 3 file">
              <div class="item-text">TOPIC 3 INTRO TO HCL<br><span class="muted">FILE</span></div>
              <div class="item-icon file">📁</div>
            </button>
            <button class="item item-btn" type="button" data-href="test.html?ch=3" aria-label="Chapter 3 test" data-test-id="ch3">
              <div class="item-text">TEST</div>
              <div class="item-icon question" data-test-icon="ch3">?</div>
            </button>
          </div>
        </div>

        <div class="chapter">
          <button class="chapter-btn" data-target="ch4">CHAPTER 4</button>
          <div id="ch4" class="chapter-body">
            <button class="item item-btn" type="button" data-href="video-note.html" aria-label="Chapter 4 video">
              <div class="item-text">TOPIC 4 INTRO TO HCL<br><span class="muted">VIDEO</span></div>
              <div class="item-icon video">▶</div>
            </button>
            <button class="item item-btn" type="button" data-href="note-exercise.html" aria-label="Chapter 4 file">
              <div class="item-text">TOPIC 4 INTRO TO HCL<br><span class="muted">FILE</span></div>
              <div class="item-icon file">📁</div>
            </button>
            <button class="item item-btn" type="button" data-href="test.html?ch=4" aria-label="Chapter 4 test" data-test-id="ch4">
              <div class="item-text">TEST</div>
              <div class="item-icon question" data-test-icon="ch4">?</div>
            </button>
          </div>
        </div>

        <div class="chapter">
          <button class="chapter-btn" data-target="lib">LIBRARY</button>
          <div id="lib" class="chapter-body">
            <button class="item item-btn" type="button" data-href="library.html" aria-label="Open library">
              <div class="item-text">LIBRARY<br><span class="muted">OPEN</span></div>
              <div class="item-icon file">📚</div>
            </button>
          </div>
        </div>

      </div>
    </main>

    <div id="testResultModal" class="result-modal" aria-hidden="true" hidden>
      <div class="result-card" role="dialog" aria-modal="true" aria-labelledby="testResultTitle">
        <div class="result-graphic" aria-hidden="true">
          <div class="result-confetti">🎉</div>
          <div class="result-try">TRY<br>AGAIN!</div>
        </div>
        <div id="testResultTitle" class="result-title"></div>
        <button id="testResultPrimary" class="result-primary" type="button"></button>
        <button id="testResultClose" class="result-close" type="button">close</button>
      </div>
    </div>
  </div>

  <script>
    // Menu toggle (shared behavior)
    (function(){
      const wraps = Array.prototype.slice.call(document.querySelectorAll('.menu-wrap'));

      function closeAll(exceptPanel){
        wraps.forEach(function(wrap){
          const panel = wrap.querySelector('.menu-panel');
          const btn = wrap.querySelector('.dots');
          if(!panel || !btn) return;
          if(exceptPanel && panel === exceptPanel) return;
          panel.style.display = 'none';
          panel.setAttribute('aria-hidden', 'true');
          btn.setAttribute('aria-expanded', 'false');
        });
      }

      wraps.forEach(function(wrap){
        const btn = wrap.querySelector('.dots');
        const panel = wrap.querySelector('.menu-panel');
        if(!btn || !panel) return;

        panel.style.display = 'none';
        panel.setAttribute('aria-hidden', 'true');
        btn.setAttribute('aria-expanded', 'false');

        btn.addEventListener('click', function(e){
          e.stopPropagation();
          const isHidden = panel.getAttribute('aria-hidden') === 'true';
          closeAll(panel);
          panel.setAttribute('aria-hidden', String(!isHidden));
          panel.style.display = isHidden ? 'flex' : 'none';
          btn.setAttribute('aria-expanded', String(isHidden));
        });
      });

      document.addEventListener('click', function(){ closeAll(); });
      document.addEventListener('keydown', function(e){ if(e.key === 'Escape') closeAll(); });
    })();

    // Chapter toggle handlers
    document.querySelectorAll('.chapter-btn').forEach(function(btn){
      btn.addEventListener('click', function(){
        const id = btn.dataset.target;
        const body = document.getElementById(id);
        const open = body.classList.toggle('open');
        // close others
        document.querySelectorAll('.chapter-body').forEach(function(b){ if(b.id !== id) b.classList.remove('open'); });
      });
    });

    // Item navigation (video/file/test)
    document.querySelectorAll('.item-btn[data-href]').forEach(function(btn){
      btn.addEventListener('click', function(){
        const href = btn.dataset.href;

        // Track where the user came from + which chapter they clicked.
        // Chapter id is the closest .chapter-body container (e.g., ch1/ch2...).
        const chapterBody = btn.closest('.chapter-body');
        if(chapterBody && chapterBody.id){
          sessionStorage.setItem('mn_chapter', chapterBody.id);
        }

        sessionStorage.setItem('mn_source', 'ongoing');

        location.href = href;
      });
    });

    // Test result: update icons + show modal after returning from test
    (function(){
      const chapters = ['ch1','ch2','ch3','ch4'];

      function applyIcon(ch){
        const icon = document.querySelector('[data-test-icon="' + ch + '"]');
        if(!icon) return;
        const state = localStorage.getItem('hcl_test_result_' + ch);
        icon.classList.remove('done', 'fail', 'question');

        if(state === 'passed'){
          icon.classList.add('done');
          icon.textContent = '✔';
        } else if(state === 'failed'){
          icon.classList.add('fail');
          icon.textContent = '✖';
        } else {
          icon.classList.add('question');
          icon.textContent = '?';
        }
      }

      chapters.forEach(applyIcon);

      function allTestsPassed(){
        return chapters.every(function(ch){
          return localStorage.getItem('hcl_test_result_' + ch) === 'passed';
        });
      }

      const allPassed = allTestsPassed();

      const lastRaw = localStorage.getItem('hcl_test_last');
      if(!lastRaw){
        if(allPassed){
          try { sessionStorage.setItem('mn_source', 'completed'); } catch(e) {}
          location.href = 'menunotescompleted.html';
        }
        return;
      }

      let last;
      try { last = JSON.parse(lastRaw); } catch(e) { return; }
      if(!last || !last.chapter || !last.outcome) return;

      const modal = document.getElementById('testResultModal');
      const title = document.getElementById('testResultTitle');
      const primary = document.getElementById('testResultPrimary');
      const close = document.getElementById('testResultClose');
      if(!modal || !title || !primary || !close) return;

      modal.hidden = false;
      modal.setAttribute('aria-hidden', 'false');

      // default: show primary unless a branch hides it
      primary.hidden = false;
      primary.style.display = '';

      if(last.outcome === 'passed'){
        modal.classList.remove('failed');
        modal.classList.add('passed');
        title.textContent = 'CONGRATULATIONS! YOU PASSED';
        // Remove the primary button on pass (no "GO TO MY COURSE" action)
        primary.onclick = null;
        primary.textContent = '';
        primary.hidden = true;
        primary.style.display = 'none';
      } else {
        modal.classList.remove('passed');
        modal.classList.add('failed');
        title.textContent = 'UNFORTUNATELY, YOU FAILED';
        primary.textContent = 'RETAKE EXERCISE';
        primary.onclick = function(){
          localStorage.removeItem('hcl_test_last');
          location.href = 'test.html?ch=' + String(last.chapter).replace('ch','');
        };
      }

      close.onclick = function(){
        localStorage.removeItem('hcl_test_last');
        if(allPassed){
          try { sessionStorage.setItem('mn_source', 'completed'); } catch(e) {}
          location.href = 'menunotescompleted.html';
          return;
        }
        modal.hidden = true;
        modal.setAttribute('aria-hidden', 'true');
      };

      modal.addEventListener('click', function(e){
        if(e.target === modal){
          localStorage.removeItem('hcl_test_last');
          if(allPassed){
            try { sessionStorage.setItem('mn_source', 'completed'); } catch(e) {}
            location.href = 'menunotescompleted.html';
            return;
          }
          modal.hidden = true;
          modal.setAttribute('aria-hidden', 'true');
        }
      });
    })();
  </script>
</body>
</html>
