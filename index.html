<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
	<title>Login — CertLab</title>
	<script>
		(function(){
			try{
				var fromStartup = /(^|[?&])from=startup(&|$)/.test(location.search);
				var done = sessionStorage.getItem('startupDone') === '1';
				if(!fromStartup && !done){
					location.replace('startup.html');
					return;
				}
				sessionStorage.setItem('startupDone', '1');
			}catch(e){
				// If sessionStorage is blocked, fall back to query param behavior
				var fromStartup2 = /(^|[?&])from=startup(&|$)/.test(location.search);
				if(!fromStartup2){
					location.replace('startup.html');
				}
			}
		})();
	</script>
	<link rel="stylesheet" href="styles.css">
</head>
<body>
	<div class="screen">
		<header class="top-logo" role="banner">
			<div class="logo">cert<span>lab</span>.</div>
		</header>

		<main class="wrap">
			<section class="login-card" aria-labelledby="login-title">
				<h1 id="login-title" class="card-title">Login Now!</h1>

				<form class="login-form" action="#" method="post" autocomplete="on">
					<label class="field">
						<span class="label-text">Email</span>
						<input class="input" type="email" name="email" placeholder="johndoe@gmail.com" required>
					</label>

					<label class="field">
						<span class="label-text">Password</span>
						<div class="password-wrap">
							<input class="input" type="password" name="password" placeholder="●●●●●●●" required aria-describedby="pw-help">
							<button type="button" class="eye-btn" aria-label="Show password" title="Show password"> 
								<!-- simple eye icon -->
								<svg width="18" height="12" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
									<path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z" stroke="#111827" stroke-opacity="0.6" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
									<circle cx="12" cy="12" r="3" stroke="#111827" stroke-opacity="0.6" stroke-width="1.2" fill="#111827" fill-opacity="0.9"/>
								</svg>
							</button>
						</div>
					</label>

					<div class="row small">
						<label class="remember"><input type="checkbox" name="remember"> Remember Me</label>
						<a class="link muted" href="#">Forgot Password?</a>
					</div>

					<button class="btn-login" type="submit">LOGIN</button>

					<p class="signup">
						Don't have an account? <a href="#">Register now</a>
					</p>
				</form>
			</section>
		</main>
	</div>

	<script>
		// Toggle password visibility for demo
		document.addEventListener('click', function(e){
			const btn = e.target.closest('.eye-btn');
			if(!btn) return;
			const wrap = btn.closest('.password-wrap');
			const input = wrap && wrap.querySelector('input');
			if(!input) return;
			if(input.type === 'password'){
				input.type = 'text';
				btn.title = 'Hide password';
			} else {
				input.type = 'password';
				btn.title = 'Show password';
			}
		});
	</script>
</body>
</html>
