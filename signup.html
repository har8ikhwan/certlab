<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Create Account — CertLab</title>
  <link rel="stylesheet" href="signup.css">
</head>
<body>
  <div class="screen">
    <header class="top-logo" role="banner">
      <div class="logo">cert<span>lab</span>.</div>
    </header>

    <main class="wrap">
      <section class="login-card signup-card" aria-labelledby="signup-title">
        <h1 id="signup-title" class="card-title">Create An Account?</h1>

        <form id="signupForm" class="login-form" action="#" method="post" autocomplete="on">
          <label class="field">
            <span class="label-text">Name</span>
            <input id="name" class="input" type="text" name="name" placeholder="john Doe" required autocomplete="name">
          </label>

          <label class="field">
            <span class="label-text">Email</span>
            <input id="email" class="input" type="email" name="email" placeholder="johndoe@gmail.com" required autocomplete="email" inputmode="email" autocapitalize="none" spellcheck="false">
          </label>

          <label class="field">
            <span class="label-text">Password</span>
            <div class="password-wrap">
              <input id="password" class="input" type="password" name="password" placeholder="●●●●●●" required minlength="7" autocomplete="new-password">
              <button type="button" class="eye-btn" aria-label="Show password" title="Show password">
                <svg width="18" height="12" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                  <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z" stroke="#111827" stroke-opacity="0.6" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
                  <circle cx="12" cy="12" r="3" stroke="#111827" stroke-opacity="0.6" stroke-width="1.2" fill="#111827" fill-opacity="0.9"/>
                </svg>
              </button>
            </div>
          </label>

          <label class="field">
            <span class="label-text">Confirm Password</span>
            <div class="password-wrap">
              <input id="confirmPassword" class="input" type="password" name="confirmPassword" placeholder="●●●●●●" required minlength="7" autocomplete="new-password">
              <button type="button" class="eye-btn" aria-label="Show password" title="Show password">
                <svg width="18" height="12" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                  <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z" stroke="#111827" stroke-opacity="0.6" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
                  <circle cx="12" cy="12" r="3" stroke="#111827" stroke-opacity="0.6" stroke-width="1.2" fill="#111827" fill-opacity="0.9"/>
                </svg>
              </button>
            </div>
          </label>

          <div class="row small">
            <label class="remember"><input id="agree" type="checkbox" name="agree" required> I agree to the <a href="#">term of service</a></label>
          </div>

          <button class="btn-create" type="submit">Create Account</button>

          <p class="signup small muted">have an account? <a href="login.html">Login now</a></p>
        </form>
      </section>
    </main>

	<div id="signupSuccess" class="toast" role="status" aria-live="polite" hidden>
		Account created!
	</div>
  </div>

  <script>
    // Validate fields (trim + email must include "@")
    (function(){
      const form = document.getElementById('signupForm');
      const name = document.getElementById('name');
      const email = document.getElementById('email');
      const password = document.getElementById('password');
      const confirmPassword = document.getElementById('confirmPassword');
      const agree = document.getElementById('agree');
      const toast = document.getElementById('signupSuccess');
      const submitBtn = form && form.querySelector('.btn-create');
      if(!form || !name || !email || !password || !confirmPassword) return;

      const MIN_PASSWORD_LENGTH = 7; // "more than 6" means 7+

      function syncPasswordValidity(){
        const passwordValue = (password.value || '').trim();
        const confirmValue = (confirmPassword.value || '').trim();

        password.setCustomValidity('');
        confirmPassword.setCustomValidity('');

        if(passwordValue.length > 0 && passwordValue.length < MIN_PASSWORD_LENGTH){
          password.setCustomValidity(`Password must be at least ${MIN_PASSWORD_LENGTH} characters.`);
        }

        // Only show mismatch once the user has started interacting
        if(confirmValue.length > 0 && passwordValue !== confirmValue){
          confirmPassword.setCustomValidity('Passwords do not match.');
        }
      }

      password.addEventListener('input', syncPasswordValidity);
      confirmPassword.addEventListener('input', syncPasswordValidity);

      form.addEventListener('submit', function(e){
        const nameValue = (name.value || '').trim();
        const emailValue = (email.value || '').trim();
        const passwordValue = (password.value || '').trim();
        const confirmValue = (confirmPassword.value || '').trim();

		// Normalize trimmed values so "   " doesn't sneak through
		name.value = nameValue;
		email.value = emailValue;
		password.value = passwordValue;
    confirmPassword.value = confirmValue;

        name.setCustomValidity('');
        email.setCustomValidity('');
        password.setCustomValidity('');
        confirmPassword.setCustomValidity('');
        if(agree) agree.setCustomValidity('');

        if(nameValue.length === 0){
          name.setCustomValidity('Name cannot be blank.');
        }

        if(emailValue.length === 0){
          email.setCustomValidity('Email cannot be blank.');
        } else if(!emailValue.includes('@')){
          email.setCustomValidity('Email must include "@".');
        }

        if(passwordValue.length === 0){
          password.setCustomValidity('Password cannot be blank.');
        } else if(passwordValue.length < MIN_PASSWORD_LENGTH){
          password.setCustomValidity(`Password must be at least ${MIN_PASSWORD_LENGTH} characters.`);
        }

        if(confirmValue.length === 0){
          confirmPassword.setCustomValidity('Confirm password cannot be blank.');
        } else if(confirmValue.length < MIN_PASSWORD_LENGTH){
          confirmPassword.setCustomValidity(`Password must be at least ${MIN_PASSWORD_LENGTH} characters.`);
        } else if(passwordValue !== confirmValue){
          confirmPassword.setCustomValidity('Passwords do not match.');
        }

		if(agree && !agree.checked){
			agree.setCustomValidity('You must agree to the terms of service.');
		}

        if(!form.checkValidity()){
          e.preventDefault();
          form.reportValidity();
      return;
        }

    // Demo flow: show feedback then redirect to login
    e.preventDefault();
    if(submitBtn) submitBtn.disabled = true;
    if(toast){
      toast.hidden = false;
      toast.classList.add('show');
    }
    setTimeout(function(){
      location.href = 'login.html';
    }, 3000);
      });

		if(agree){
			agree.addEventListener('change', function(){
				agree.setCustomValidity('');
			});
		}
    })();

    // Toggle password visibility
    document.addEventListener('click', function(e){
      const btn = e.target.closest('.eye-btn');
      if(!btn) return;
      const wrap = btn.closest('.password-wrap');
      const input = wrap && wrap.querySelector('input');
      if(!input) return;
      if(input.type === 'password'){
        input.type = 'text';
        btn.title = 'Hide password';
        btn.setAttribute('aria-label', 'Hide password');
      } else {
        input.type = 'password';
        btn.title = 'Show password';
        btn.setAttribute('aria-label', 'Show password');
      }
    });
    
    // Swipe-right (left->right) edge gesture to go back to login.html
    (function(){
      let startX = 0, startY = 0;
      const threshold = 60; // min horizontal px to count as swipe
      const restraint = 80; // max vertical movement
      const edgeMax = 30;   // max x from left edge to start gesture

      function onStart(e){
        const t = e.changedTouches ? e.changedTouches[0] : e;
        // only start when touch begins near the left edge
        if(t.clientX > edgeMax) return;
        // ignore when typing in an input
        if(document.activeElement && /input|textarea/i.test(document.activeElement.tagName)) return;
        startX = t.clientX; startY = t.clientY;
      }

      function onEnd(e){
        const t = e.changedTouches ? e.changedTouches[0] : e;
        const dx = t.clientX - startX;
        const dy = t.clientY - startY;
        if(Math.abs(dx) >= threshold && Math.abs(dy) <= restraint && dx > 0){
          // Go to login.html (use replace to avoid adding extra history entry if desired)
          location.href = 'login.html';
        }
      }

      document.addEventListener('touchstart', onStart, {passive:true});
      document.addEventListener('touchend', onEnd, {passive:true});
    })();
  </script>
</body>
</html>
