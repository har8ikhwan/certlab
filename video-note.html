<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Video 1: Intro to HCI</title>
    <link rel="stylesheet" href="video-note.css">
</head>
<body>
    <div class="phone-shell">
        <header class="header">
            <a href="#" class="back">&lt; Back</a>
            <span class="title">Video 1: Intro to HCI</span>
            <div class="menu-wrap">
                <button class="dots" aria-label="open menu" aria-expanded="false">⋯</button>
                <div class="menu-panel" aria-hidden="true" style="display:none" role="menu">
                    <a class="menu-btn" href="profile.html" role="menuitem">👤 Profile</a>
                </div>
            </div>
        </header>

        <main class="content">
            <div class="video-wrapper">
                
                 <video id="dev-video" controls playsinline preload="metadata" src="CTU.mp4"s></video>
            </div>

            <div class="tabs">
                <div class="tab friendly active" aria-hidden="true">Description</div>
            </div>

            <div id="desc" class="tab-content active">
                <p>So today we are going to through on the overview of HCI... So Basically axxxxxxxxxxxxxxxxxxxxxxxxxxxx</p>
            </div>

            <section class="notes">
                <div class="note-actions">
                    <button id="saveNote" class="btn primary">Save Note</button>
                    <button id="editNote" class="btn">Edit Note</button>
                </div>
                <textarea id="noteText" placeholder="Create Note....."></textarea>
            </section>
        </main>

        <footer>
            <button id="takeExercise" class="take-btn">TAKE EXERCISE</button>
        </footer>
        <!-- Inline warning for empty-note save attempts -->
        <div id="noteWarning" class="note-warning" role="status" aria-live="polite">PLEASE INSERT FIRST IN THE NOTE SPACE</div>
    </div>

    <!-- Modal -->
    <div id="confirmModal" class="modal" aria-hidden="true">
        <div class="modal-box">
            <div class="modal-icon">!
            </div>
            <div class="modal-text">ARE YOU SURE YOU WANT TO TAKE EXERCISE NOW?</div>
            <div class="modal-actions">
                <button id="modalCancel" class="modal-btn no" title="Cancel">✖</button>
                <button id="modalConfirm" class="modal-btn yes" title="Proceed">✔</button>
            </div>
        </div>
    </div>

    <script>
        // Back goes to the correct notes menu (ongoing vs completed)
        (function(){
            const back = document.querySelector('a.back');
            if(!back) return;
            const src = sessionStorage.getItem('mn_source');
            back.href = (src === 'completed') ? 'menunotescompleted.html' : 'menunotesongoing.html';
        })();

        // Menu toggle (same behavior as menunotesongoing.html)
        (function(){
            const wraps = Array.prototype.slice.call(document.querySelectorAll('.menu-wrap'));

            function closeAll(exceptPanel){
                wraps.forEach(function(wrap){
                    const panel = wrap.querySelector('.menu-panel');
                    const btn = wrap.querySelector('.dots');
                    if(!panel || !btn) return;
                    if(exceptPanel && panel === exceptPanel) return;
                    panel.style.display = 'none';
                    panel.setAttribute('aria-hidden', 'true');
                    btn.setAttribute('aria-expanded', 'false');
                });
            }

            wraps.forEach(function(wrap){
                const btn = wrap.querySelector('.dots');
                const panel = wrap.querySelector('.menu-panel');
                if(!btn || !panel) return;

                panel.style.display = 'none';
                panel.setAttribute('aria-hidden', 'true');
                btn.setAttribute('aria-expanded', 'false');

                btn.addEventListener('click', function(e){
                    e.stopPropagation();
                    const isHidden = panel.getAttribute('aria-hidden') === 'true';
                    closeAll(panel);
                    panel.setAttribute('aria-hidden', String(!isHidden));
                    panel.style.display = isHidden ? 'flex' : 'none';
                    btn.setAttribute('aria-expanded', String(isHidden));
                });
            });

            document.addEventListener('click', function(){ closeAll(); });
            document.addEventListener('keydown', function(e){ if(e.key === 'Escape') closeAll(); });
        })();

        // Description is a static label now (no tab switching required)

        // Notes: Save and Edit using localStorage
        const saveBtn = document.getElementById('saveNote');
        const editBtn = document.getElementById('editNote');
        const noteText = document.getElementById('noteText');
        const STORAGE_KEY = 'video_note_text_v1';

        function setEditing(enabled) {
            noteText.readOnly = !enabled;
            saveBtn.disabled = !enabled;
            if (!enabled) {
                saveBtn.classList.remove('primary');
            } else {
                saveBtn.classList.add('primary');
            }
        }

        function loadSavedNote() {
            const saved = localStorage.getItem(STORAGE_KEY);
            if (saved) {
                noteText.value = saved;
                // If a saved note exists, lock the textarea until Edit is pressed
                setEditing(false);
            } else {
                // No saved note -> allow writing
                noteText.value = '';
                setEditing(true);
            }
        }

        saveBtn.addEventListener('click', () => {
            // Prevent saving if textarea is empty
            if (!noteText.value || noteText.value.trim() === '') {
                showNoteWarning();
                return;
            }
            localStorage.setItem(STORAGE_KEY, noteText.value || '');
            saveBtn.textContent = 'Saved';
            // After saving, lock the textarea so user must press Edit to change
            setEditing(false);
            setTimeout(() => saveBtn.textContent = 'Save Note', 1200);
        });

        function showNoteWarning() {
            const warn = document.getElementById('noteWarning');
            if (!warn) return;
            warn.style.display = 'block';
            // trigger animation
            requestAnimationFrame(() => {
                warn.style.opacity = '1';
                warn.style.transform = 'translateX(-50%) translateY(0)';
            });
            // hide after 1.6s
            clearTimeout(window._noteWarnTimeout);
            window._noteWarnTimeout = setTimeout(() => {
                warn.style.opacity = '0';
                warn.style.transform = 'translateX(-50%) translateY(-8px)';
                setTimeout(() => { warn.style.display = 'none'; }, 300);
            }, 1600);
        }

        editBtn.addEventListener('click', () => {
            const saved = localStorage.getItem(STORAGE_KEY) || '';
            // Enable editing and populate the textarea with saved content
            noteText.value = saved;
            setEditing(true);
            noteText.focus();
        });

        // Modal for Take Exercise
        const takeBtn = document.getElementById('takeExercise');
        const modal = document.getElementById('confirmModal');
        const modalCancel = document.getElementById('modalCancel');
        const modalConfirm = document.getElementById('modalConfirm');

        takeBtn.addEventListener('click', () => {
            modal.style.display = 'flex';
            modal.setAttribute('aria-hidden', 'false');
        });
        modalCancel.addEventListener('click', () => {
            modal.style.display = 'none';
            modal.setAttribute('aria-hidden', 'true');
        });
        modalConfirm.addEventListener('click', () => {
            // Proceed to exercise page (existing file)
            window.location.href = 'exercise.html';
        });

        // Close modal when clicking outside
        window.addEventListener('click', (e) => {
            if (e.target === modal) {
                modal.style.display = 'none';
                modal.setAttribute('aria-hidden', 'true');
            }
        });

        // Load saved note on open
        loadSavedNote();
    </script>
</body>
</html>
